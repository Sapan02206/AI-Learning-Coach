<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Learning Coach - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.7);
            padding: 2rem;
            border-radius: 16px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div id="root">Loading...</div>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState } = React;
        
        function App() {
            const [message, setMessage] = useState('React is working!');
            const Brain = lucide.Brain;
            
            return React.createElement('div', { className: 'container' },
                React.createElement('h1', null, 'AI Learning Consistency Coach'),
                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '20px' } },
                    React.createElement(Brain, { size: 32, color: '#3b82f6' }),
                    React.createElement('p', null, message)
                ),
                React.createElement('button', {
                    onClick: () => setMessage('Everything is working! ✅')
                }, 'Test Button')
            );
        }
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        console.log('✅ React loaded:', typeof React);
        console.log('✅ ReactDOM loaded:', typeof ReactDOM);
        console.log('✅ Lucide loaded:', typeof lucide);
    </script>
</body>
</html>
